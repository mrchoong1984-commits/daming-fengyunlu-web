<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#241a16"><title>大明风云录 · 文字江湖</title>
<style>
:root{--bg:#171311;--panel:#241d19;--ink:#f4e7d0;--muted:#c3ad91;--gold:#d5ad68;--line:#604a37}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38291e 0,#171311 62%);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif;min-height:100vh}.wrap{max-width:850px;margin:0 auto;padding:20px 14px 34px}header{text-align:center;padding:22px 8px 18px;border-bottom:1px solid var(--line)}.kicker{font-size:12px;letter-spacing:.3em;color:var(--gold)}h1{font-size:clamp(28px,7vw,44px);letter-spacing:.12em;margin:12px 0 8px}.subtitle{font-size:13px;color:var(--muted);letter-spacing:.08em}.panel{background:linear-gradient(145deg,rgba(48,37,30,.96),rgba(32,25,21,.97));border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:15px;box-shadow:0 10px 30px #0003}h2{font-size:16px;color:var(--gold);margin:0 0 12px;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input,textarea{width:100%;border:1px solid #6b513b;border-radius:9px;background:#171311;color:var(--ink);padding:11px 12px;font:inherit;font-size:15px;outline:none}input:focus,textarea:focus{border-color:var(--gold)}textarea{resize:vertical;min-height:70px}.small{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}button{border:1px solid #d5ad68;border-radius:9px;background:linear-gradient(#d8b879,#b98a49);color:#241811;font:inherit;font-weight:700;padding:12px 15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:transparent;color:var(--gold);border-color:var(--line)}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{flex:1}.story{min-height:150px;white-space:pre-wrap;line-height:1.95;font-size:16px}.entry{padding:12px 0;border-bottom:1px solid #4b392b}.entry:last-child{border-bottom:0}.entry .who{color:var(--gold);font-size:12px;margin-bottom:5px;letter-spacing:.08em}.entry .words{white-space:pre-wrap;line-height:1.9}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}.status.error{color:#ff9d8c}.footer{text-align:center;color:#8f7a65;font-size:12px;padding:20px 0}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:13px}h1{letter-spacing:.06em}.story{font-size:15px}}
</style></head><body><div class="wrap"><header><div class="kicker">山河 · 庙堂 · 江湖</div><h1>大明风云录</h1><div class="subtitle">一念入局，天下生变 · AI 文字冒险</div></header>
<section class="panel"><h2>行旅档案</h2><div class="grid"><div><label for="playerName">姓名</label><input id="playerName" maxlength="40" value="旅人" placeholder="例如：沈砚"></div><div><label for="background">身份背景</label><input id="background" maxlength="300" value="身份未明的旅人" placeholder="例如：初入京城的落魄书生"></div></div><div style="margin-top:11px"><label for="worldState">当前局势（可选）</label><textarea id="worldState" maxlength="2000">大明王朝，天下局势正在变化。</textarea></div><div class="small">填写你的身份与局势。故事会根据你的行动推进；你决定自己做什么，世界负责回应。</div></section>
<section class="panel"><h2>当前见闻</h2><div id="story" class="story">你来到一座陌生城镇。街上行人匆匆，远处传来更夫敲梆的声音。\n\n你可以在下方输入任何行动，例如：“我走进茶馆，询问店小二最近京城发生了什么事。”</div></section>
<section class="panel"><h2>写下你的行动</h2><textarea id="action" maxlength="2000" rows="3" placeholder="例如：我走进茶馆，找一张靠窗的桌子坐下。"></textarea><div class="row" style="margin-top:10px"><button id="send">行动</button><button id="reset" class="secondary" type="button">重新开始</button></div><div id="status" class="status" role="status"></div></section>
<section class="panel"><h2>过往记录</h2><div id="history"><div class="small">你的行动与世界回应会显示在这里。</div></div><div class="row" style="margin-top:12px"><button id="save" class="secondary" type="button">导出存档</button><button id="load" class="secondary" type="button">导入存档</button><input id="file" type="file" accept="application/json,.json" hidden></div><div class="small">记录保存在当前页面内存中；导出存档可备份进度。</div></section><div class="footer">大明风云录 · 网页试玩版</div></div>
<script>
const API_URL="https://daming-fengyunlu.onrender.com/api/turn";const $=id=>document.getElementById(id);let turns=[];let busy=false;
function setStatus(m,e=false){$("status").textContent=m;$("status").className="status"+(e?" error":"")}
function renderHistory(){const box=$("history");if(!turns.length){box.innerHTML='<div class="small">你的行动与世界回应会显示在这里。</div>';return}box.replaceChildren();turns.forEach(t=>{const item=document.createElement("div");item.className="entry";const who=document.createElement("div");who.className="who";who.textContent=t.role==="user"?"你的行动":"世界回应";const words=document.createElement("div");words.className="words";words.textContent=t.content;item.append(who,words);box.append(item)})}
function addTurn(role,content){turns.push({role,content});renderHistory()}
function resetGame(){if(busy)return;turns=[];$("story").textContent="你来到一座陌生城镇。街上行人匆匆，远处传来更夫敲梆的声音。\n\n你可以在下方输入任何行动，世界将根据你的行动作出回应。";$("action").value="";renderHistory();setStatus("已重新开始。")}
async function takeTurn(){if(busy)return;const action=$("action").value.trim();if(!action){setStatus("先写下你要做的事。",true);return}busy=true;$("send").disabled=true;$("send").textContent="故事生成中…";setStatus("正在联系 AI，请稍候；首次请求可能需要一些时间。");const prior=turns.slice(-20).map(t=>({role:t.role==="assistant"?"assistant":"user",content:t.content}));try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({player_name:$("playerName").value.trim()||"旅人",player_background:$("background").value.trim()||"身份未明的旅人",world_state:$("worldState").value.trim()||"大明王朝，天下局势正在变化。",action,history:prior})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.detail||("服务器返回状态码 "+res.status));const reply=(data.reply||data.text||"").trim();if(!reply)throw new Error("AI 返回了空内容，请稍后再试。");addTurn("user",action);addTurn("assistant",reply);$("story").textContent=reply;$("action").value="";setStatus("已收到回应。你可以继续行动。");$("story").scrollIntoView({behavior:"smooth",block:"center"})}catch(err){setStatus("请求失败："+(err.message||"网络错误")+"。请稍后重试；若持续失败，请检查后端服务。",true)}finally{busy=false;$("send").disabled=false;$("send").textContent="行动"}}
function exportSave(){const save={version:1,player_name:$("playerName").value,player_background:$("background").value,world_state:$("worldState").value,turns,story:$("story").textContent};const blob=new Blob([JSON.stringify(save,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="大明风云录-存档.json";a.click();URL.revokeObjectURL(url);setStatus("存档已导出。")}
function importSave(file){const reader=new FileReader();reader.onload=()=>{try{const s=JSON.parse(reader.result);if(!s||!Array.isArray(s.turns))throw new Error();turns=s.turns.filter(t=>t&&["user","assistant"].includes(t.role)&&typeof t.content==="string").slice(-200);$("playerName").value=String(s.player_name||"旅人").slice(0,40);$("background").value=String(s.player_background||"身份未明的旅人").slice(0,300);$("worldState").value=String(s.world_state||"大明王朝，天下局势正在变化。").slice(0,2000);$("story").textContent=String(s.story||"存档已载入。");renderHistory();setStatus("存档载入成功。")}catch{setStatus("存档文件无效，无法载入。",true)}$("file").value=""};reader.readAsText(file)}
$("send").addEventListener("click",takeTurn);$("action").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();takeTurn()}});$("reset").addEventListener("click",resetGame);$("save").addEventListener("click",exportSave);$("load").addEventListener("click",()=>$("file").click());$("file").addEventListener("change",e=>{if(e.target.files&&e.target.files[0])importSave(e.target.files[0])});
</script></body></html>
